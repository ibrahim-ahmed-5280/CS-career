<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CS Career · Hormuud University</title>
  <meta name="description" content="Orientation guide for new Computer Science students at Hormuud University: departments, careers and learning roadmaps in English, Somali and Arabic.">
  <meta name="theme-color" content="#0b1b2b">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/lipis/flag-icons@7.2.3/css/flag-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body data-page="home">
  <header class="topbar" id="siteHeader"></header>

  <main id="main">
    <section class="hero" id="top">
      <div class="hero-art" id="heroArt"></div>
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <h1 id="heroTitle"></h1>
          <p class="lead" id="heroSub"></p>
          <div class="cta">
            <a class="btn invert" href="#departments" id="heroCta1"></a>
            <a class="btn outline-light" href="quiz.html" id="heroCta2"></a>
          </div>
        </div>
      </div>
    </section>

    <section id="about" class="sec">
      <div class="wrap">
        <header class="sec-head"><h2 id="aboutTitle"></h2><p id="aboutSub"></p></header>
        <div class="cols3" id="aboutCards"></div>
        <div class="tips" id="aboutTips"></div>
      </div>
    </section>

    <section id="departments" class="sec tint">
      <div class="wrap">
        <header class="sec-head"><h2 id="deptsTitle"></h2><p id="deptsSub"></p></header>
        <div class="cards" id="deptCards"></div>
      </div>
    </section>

    <section id="quiz" class="quiz-band">
      <div class="wrap band-row">
        <div class="band-copy"><h2 id="quizTitle"></h2><p id="quizSub"></p></div>
        <a class="btn primary big" id="quizGo" href="quiz.html"></a>
      </div>
    </section>

    <section id="learn" class="sec tint">
      <div class="wrap">
        <header class="sec-head"><h2 id="pathsTitle"></h2><p id="pathsSub"></p></header>
        <h3 class="h3" id="startTitle"></h3>
        <p class="muted" id="startSub"></p>
        <div class="res" id="commonRes"></div>
        <div class="two">
          <div><h3 class="h3" id="payTitle"></h3><ol class="pay" id="payList"></ol></div>
          <div><h3 class="h3" id="habitTitle"></h3><ul class="habits" id="habitList"></ul></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="siteFooter"></footer>

  <script src="js/data.js"></script>
  <script src="js/lang-en.js"></script><script src="js/lang-so.js"></script><script src="js/lang-ar.js"></script>
  <script src="js/extra-en.js"></script><script src="js/extra-so.js"></script><script src="js/extra-ar.js"></script>
  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
