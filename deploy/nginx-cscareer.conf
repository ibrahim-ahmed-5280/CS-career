server {
    listen 80;
    listen [::]:80;
    server_name cscareer.onepercenttech.com;
    location /.well-known/acme-challenge/ { root /var/www/cscareer; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cscareer.onepercenttech.com;
    ssl_certificate /etc/letsencrypt/live/cscareer.onepercenttech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscareer.onepercenttech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Built React files: hashed names never change, so cache them for a long time
    location /assets/ {
        root /opt/cscareer/client/dist;
        try_files $uri @app;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # Everything else (pages and /api) is answered by the Node app
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @app { proxy_pass http://127.0.0.1:4000; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 1m;
}
