server {
    listen 80;
    listen [::]:80;
    server_name cscareer.onepercenttech.com;
    location /.well-known/acme-challenge/ { root /var/www/cscareer; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cscareer.onepercenttech.com;
    ssl_certificate /etc/letsencrypt/live/cscareer.onepercenttech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cscareer.onepercenttech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;


    root /var/www/cscareer;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Always revalidate so a new push shows up on the next page load (ETag makes unchanged files a cheap 304)
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
