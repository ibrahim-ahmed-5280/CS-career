# Used once, before the HTTPS certificate exists, so certbot can verify the domain.
server {
    listen 80;
    listen [::]:80;
    server_name cscareer.onepercenttech.com;
    location /.well-known/acme-challenge/ { root /var/www/cscareer; }
    location / { return 200 "CS Career is being set up.\n"; add_header Content-Type text/plain; }
}
